<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Оплата не пройшла, Цигун Ходьба</title>
<style>
  :root{
    --bg:#fbfaf7; --card:#ffffff; --text:#262421; --muted:#8a8578;
    --accent:#5c8a6e; --accent-dark:#43704f; --warn:#b8735a; --warn-soft:#fbf1ec; --border:#e2ded4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  h1{font-family:Georgia,"PT Serif",serif;font-weight:700;margin:0 0 10px;font-size:26px;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
  .badge{width:70px;height:70px;border-radius:50%;background:var(--warn-soft);color:var(--warn);
    display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:20px;}
  p{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 24px;}
  .cta{
    display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
    border-radius:999px;padding:16px 28px;font-weight:700;font-size:15.5px;
    box-shadow:0 8px 20px -8px rgba(92,138,110,.6);
  }
  .fine{font-size:12px;color:var(--muted);margin-top:24px;}
</style>
</head>
<body>
<div class="wrap"> <div class="badge">!</div> <h1>Оплата не пройшла</h1> <p>Це могло статися через нестабільне з'єднання або обмеження банку. Спробуйте оплатити ще раз, кошти за невдалу спробу з вас не списують.</p> <!-- 🔧 замінити на реальний W4P button URL обраного тарифу (12-тижневий за замовчуванням) --> <a class="cta" href="">Спробувати ще раз</a> <p class="fine">Якщо проблема повторюється, напишіть нам і ми допоможемо оформити оплату вручну.</p>
</div>
</body>
</html>
