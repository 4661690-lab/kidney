<style>
:root{--bg:#100e0b;--bg2:#171207;--card:#1c1710;--line:#2e2718;--txt:#f2e8d9;--mut:#b6ab97;--mut2:#8a8172;--gold:#e0b87a;--gold2:#eac88f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(820px 520px at 50% 0%,rgba(224,184,122,.14),transparent 60%),var(--bg);color:var(--txt);
 font-family:'Inter',sans-serif;font-size:16px;line-height:1.62;min-height:100vh;display:flex;align-items:center;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:44px 22px;width:100%}
.kicker{color:var(--gold);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(32px,7.6vw,52px);line-height:1.06;margin-bottom:16px}
p{color:var(--mut);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:22px}
.card p{margin:0;color:var(--txt)}
.btn{display:block;width:100%;max-width:420px;text-align:center;text-decoration:none;background:var(--gold);color:#171207;
 font-weight:700;font-size:16px;letter-spacing:.03em;padding:17px 26px;border-radius:100px;transition:.2s}
.btn:hover{background:var(--gold2)}
.btn.off{opacity:.45;cursor:default}
.note{color:var(--mut2);font-size:13px;margin-top:14px}
a.mail{color:var(--gold)}
@media(min-width:700px){.btn{display:inline-block;width:auto;min-width:320px}}
